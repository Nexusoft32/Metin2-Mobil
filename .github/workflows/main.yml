            GLVECTOR2 operator+(const GLVECTOR2& rhs) const { return GLVECTOR2(x + rhs.x, y + rhs.y); }
            GLVECTOR2 operator-(const GLVECTOR2& rhs) const { return GLVECTOR2(x - rhs.x, y - rhs.y); }
            GLVECTOR2 operator*(float s) const { return GLVECTOR2(x * s, y * s); }
            GLVECTOR2& operator+=(const GLVECTOR2& rhs) { x += rhs.x; y += rhs.y; return *this; }
            GLVECTOR2& operator-=(const GLVECTOR2& rhs) { x -= rhs.x; y -= rhs.y; return *this; }
