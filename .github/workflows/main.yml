        // Math Functions
        inline GLVECTOR3* D3DXVec3Normalize(GLVECTOR3* pOut, const GLVECTOR3* pV) {
            float len = sqrtf(pV->x * pV->x + pV->y * pV->y + pV->z * pV->z);
            if (len > 1e-6f) { pOut->x = pV->x / len; pOut->y = pV->y / len; pOut->z = pV->z / len; }
            else { pOut->x = pOut->y = pOut->z = 0.0f; }
            return pOut;
        }
        inline float D3DXVec3Dot(const GLVECTOR3* pV1, const GLVECTOR3* pV2) {
            return pV1->x * pV2->x + pV1->y * pV2->y + pV1->z * pV2->z;
        }
        inline GLVECTOR3* D3DXVec3Cross(GLVECTOR3* pOut, const GLVECTOR3* pV1, const GLVECTOR3* pV2) {
            GLVECTOR3 tmp(pV1->y * pV2->z - pV1->z * pV2->y, pV1->z * pV2->x - pV1->x * pV2->z, pV1->x * pV2->y - pV1->y * pV2->x);
            *pOut = tmp;
            return pOut;
        }
        inline float D3DXVec3LengthSq(const GLVECTOR3* pV) { return pV->x * pV->x + pV->y * pV->y + pV->z * pV->z; }
        inline float D3DXVec3Length(const GLVECTOR3* pV) { return sqrtf(D3DXVec3LengthSq(pV)); }
        inline float D3DXVec2LengthSq(const GLVECTOR2* pV) { return pV->x * pV->x + pV->y * pV->y; }
        inline float D3DXVec2Length(const GLVECTOR2* pV) { return sqrtf(D3DXVec2LengthSq(pV)); }
        inline float D3DXVec2Dot(const GLVECTOR2* pV1, const GLVECTOR2* pV2) { return pV1->x * pV2->x + pV1->y * pV2->y; }
        inline GLVECTOR2* D3DXVec2Normalize(GLVECTOR2* pOut, const GLVECTOR2* pV) {
            float len = D3DXVec2Length(pV);
            if (len > 1e-6f) { pOut->x = pV->x / len; pOut->y = pV->y / len; }
            else { pOut->x = pOut->y = 0.0f; }
            return pOut;
        }
        inline GLVECTOR3* D3DXVec3TransformCoord(GLVECTOR3* pOut, const GLVECTOR3* pV, const GLMATRIX* pM) { *pOut = *pV; return pOut; }
        inline GLVECTOR3* D3DXVec3TransformNormal(GLVECTOR3* pOut, const GLVECTOR3* pV, const GLMATRIX* pM) { *pOut = *pV; return pOut; }
        inline GLVECTOR4* D3DXVec3Transform(GLVECTOR4* pOut, const GLVECTOR3* pV, const GLMATRIX* pM) { pOut->x = pV->x; pOut->y = pV->y; pOut->z = pV->z; pOut->w = 1.0f; return pOut; }
        inline GLMATRIX* D3DXMatrixIdentity(GLMATRIX* pOut) {
            memset(pOut->m, 0, sizeof(pOut->m));
            pOut->m[0][0] = pOut->m[1][1] = pOut->m[2][2] = pOut->m[3][3] = 1.0f;
            return pOut;
        }
        inline GLMATRIX* D3DXMatrixInverse(GLMATRIX* pOut, float* pDeterminant, const GLMATRIX* pM) { *pOut = *pM; return pOut; }
        inline GLMATRIX* D3DXMatrixTranspose(GLMATRIX* pOut, const GLMATRIX* pM) { *pOut = *pM; return pOut; }
        inline GLMATRIX* D3DXMatrixMultiply(GLMATRIX* pOut, const GLMATRIX* pM1, const GLMATRIX* pM2) {
            GLMATRIX out;
            for (int i = 0; i < 4; ++i)
                for (int j = 0; j < 4; ++j)
                    out.m[i][j] = pM1->m[i][0] * pM2->m[0][j] + pM1->m[i][1] * pM2->m[1][j] + pM1->m[i][2] * pM2->m[2][j] + pM1->m[i][3] * pM2->m[3][j];
            *pOut = out;
            return pOut;
        }
        inline GLMATRIX* D3DXMatrixTranslation(GLMATRIX* pOut, float x, float y, float z) {
            D3DXMatrixIdentity(pOut);
            pOut->m[3][0] = x; pOut->m[3][1] = y; pOut->m[3][2] = z;
            return pOut;
        }
        inline GLMATRIX* D3DXMatrixScaling(GLMATRIX* pOut, float x, float y, float z) {
            D3DXMatrixIdentity(pOut);
