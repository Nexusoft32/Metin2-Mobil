name: Metin2 Android APK Uretici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kaynak Kodlari Cek
      uses: actions/checkout@v4

    - name: Java JDK 21 Kur
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Android Lisanslarini Otomatik Onayla
      run: |
        yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Gradle 8.13 Kur
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.13'

    - name: C++ Windows/DirectX Uyumlulugunu Yamala ve APK Derle
      working-directory: ./Cross Platform/opengl/android
      run: |
        rm -f local.properties
        cd ..
        
        cat << 'EOF' > fix_all.py
        import os, re

        for root, dirs, files in os.walk("clientsource"):
            for fname in files:
                if fname.lower() == "windows.h" and "android_compat" in root.lower():
                    wpath = os.path.join(root, fname)
                    with open(wpath, "r", encoding="latin-1") as f:
                        wcode = f.read()
                    wcode = wcode.replace("typedef uint32_t DWORD;", "typedef unsigned long DWORD;")
                    with open(wpath, "w", encoding="latin-1") as f:
                        f.write(wcode)

                if fname.lower() == "grpopengl.h":
                    gpath = os.path.join(root, fname)
                    with open(gpath, "r", encoding="latin-1") as f:
                        gcode = f.read()

                    print("=== GRPOPENGL.H 600-SONU ARASI ===")
                    for i, line in enumerate(gcode.splitlines()[599:], 600):
                        print(f"{i}: {line}")
                    print("==================================")

                    # Eger dosya icinde asagilarda IDirect3DTexture8 vb. tanimlanmissa cift tanim olmamasi icin adlarini degistir
                    gcode = re.sub(r"\bstruct\s+IDirect3DTexture8\b", "struct _Old_IDirect3DTexture8", gcode)
                    gcode = re.sub(r"\bstruct\s+IDirect3DSurface8\b", "struct _Old_IDirect3DSurface8", gcode)
                    gcode = re.sub(r"\bstruct\s+IDirect3DVertexBuffer8\b", "struct _Old_IDirect3DVertexBuffer8", gcode)
                    gcode = re.sub(r"\bstruct\s+IDirect3DIndexBuffer8\b", "struct _Old_IDirect3DIndexBuffer8", gcode)
                    gcode = re.sub(r"\bstruct\s+IDirect3DBaseTexture8\b", "struct _Old_IDirect3DBaseTexture8", gcode)

                    # 1. En tepeye eklenecek TAM VE EKSIKSIZ DirectX 8 tipleri ve siniflari (Tamami IDirect3DDevice8'den once!)
                    top_lines = [
                        "#pragma once",
                        "#include <stdint.h>",
                        "#include <stdlib.h>",
                        "#include <string.h>",
                        "#ifdef ANDROID",
                        "#include <GLES2/gl2.h>",
                        "#include <GLES2/gl2ext.h>",
                        "#endif",
                        "typedef unsigned char BYTE;",
                        "typedef unsigned short WORD;",
                        "typedef unsigned long DWORD;",
                        "typedef unsigned long ULONG;",
                        "typedef int32_t LONG;",
                        "typedef unsigned int UINT;",
                        "typedef int BOOL;",
                        "typedef long HRESULT;",
                        "typedef const void* LPCVOID;",
                        "typedef void* LPVOID;",
                        "typedef void* HWND;",
                        "typedef void* HDC;",
                        "typedef void* HGLRC;",
                        "#ifndef CONST",
                        "#define CONST const",
                        "#endif",
                        "#ifndef S_OK",
                        "#define S_OK ((HRESULT)0L)",
                        "#endif",
                        "#ifndef RECT_DEFINED",
                        "#define RECT_DEFINED",
                        "typedef struct tagRECT { LONG left; LONG top; LONG right; LONG bottom; } RECT;",
                        "#endif",
                        "typedef int D3DFORMAT;",
                        "typedef int D3DPOOL;",
                        "typedef int D3DDEVTYPE;",
                        "typedef int D3DMULTISAMPLE_TYPE;",
                        "typedef int D3DBACKBUFFER_TYPE;",
                        "typedef int D3DPRIMITIVETYPE;",
                        "typedef int D3DTEXTURESTAGESTATETYPE;",
                        "typedef int D3DRENDERSTATETYPE;",
                        "typedef int D3DTRANSFORMSTATETYPE;",
                        "#ifndef D3DFMT_A8R8G8B8",
                        "#define D3DFMT_UNKNOWN 0",
                        "#define D3DFMT_R8G8B8 20",
                        "#define D3DFMT_A8R8G8B8 21",
                        "#define D3DFMT_X8R8G8B8 22",
                        "#define D3DFMT_R5G6B5 23",
                        "#define D3DFMT_A1R5G5B5 25",
                        "#define D3DFMT_A4R4G4B4 26",
                        "#define D3DFMT_A8 28",
                        "#define D3DFMT_DXT1 827611204",
                        "#define D3DFMT_DXT3 861165636",
                        "#define D3DFMT_DXT5 894720068",
                        "#define D3DFMT_D16 80",
                        "#define D3DFMT_D24S8 75",
                        "#define D3DFMT_INDEX16 101",
                        "#define D3DFMT_INDEX32 102",
                        "#endif",
                        "#ifndef D3DPOOL_MANAGED",
                        "#define D3DPOOL_DEFAULT 0",
                        "#define D3DPOOL_MANAGED 1",
                        "#define D3DPOOL_SYSTEMMEM 2",
                        "#define D3DPOOL_SCRATCH 3",
                        "#endif",
                        "#ifndef D3DFVF_XYZ",
                        "#define D3DFVF_XYZ 0x002",
                        "#define D3DFVF_XYZRHW 0x004",
                        "#define D3DFVF_NORMAL 0x010",
                        "#define D3DFVF_DIFFUSE 0x040",
                        "#define D3DFVF_SPECULAR 0x080",
                        "#define D3DFVF_TEX1 0x100",
                        "#define D3DFVF_TEX2 0x200",
                        "#define D3DFVF_TEXCOUNT_MASK 0xf00",
                        "#define D3DFVF_TEXCOUNT_SHIFT 8",
                        "#endif",
                        "#define D3DDEVCAPS_HWTRANSFORMANDLIGHT 0x00010000L",
                        "#define D3DCAPS2_CANRENDERWINDOWED 0x00080000L",
                        "#define D3DVTXPCAPS_DIRECTIONALLIGHTS 0x00000008L",
                        "#define D3DVTXPCAPS_POSITIONALLIGHTS 0x00000010L",
                        "#define D3DVTXPCAPS_TEXGEN 0x00000001L",
                        "#define D3DPMISCCAPS_CLIPTLVERTS 0x00000200L",
                        "#define D3DPTADDRESSCAPS_BORDER 0x00000008L",
                        "typedef struct _D3DVIEWPORT8 { DWORD X; DWORD Y; DWORD Width; DWORD Height; float MinZ; float MaxZ; } D3DVIEWPORT8;",
                        "typedef struct _D3DADAPTER_IDENTIFIER8 { char Driver[512]; char Description[512]; DWORD DriverVersionLowPart; DWORD DriverVersionHighPart; DWORD VendorId; DWORD DeviceId; DWORD SubSysId; DWORD Revision; DWORD DeviceIdentifier[4]; DWORD WHQLLevel; } D3DADAPTER_IDENTIFIER8;",
                        "typedef struct _D3DDISPLAYMODE { UINT Width; UINT Height; UINT RefreshRate; D3DFORMAT Format; } D3DDISPLAYMODE;",
                        "typedef struct _D3DCAPS8 { D3DDEVTYPE DeviceType; UINT AdapterOrdinal; DWORD Caps; DWORD Caps2; DWORD Caps3; DWORD PresentationIntervals; DWORD CursorCaps; DWORD DevCaps; DWORD PrimitiveMiscCaps; DWORD RasterCaps; DWORD ZCmpCaps; DWORD SrcBlendCaps; DWORD DestBlendCaps; DWORD AlphaCmpCaps; DWORD ShadeCaps; DWORD TextureCaps; DWORD TextureFilterCaps; DWORD CubeTextureFilterCaps; DWORD VolumeTextureFilterCaps; DWORD TextureAddressCaps; DWORD VolumeTextureAddressCaps; DWORD LineCaps; DWORD MaxTextureWidth; DWORD MaxTextureHeight; DWORD MaxVolumeExtent; DWORD MaxTextureRepeat; DWORD MaxTextureAspectRatio; DWORD MaxAnisotropy; float MaxVertexW; float GuardBandLeft; float GuardBandTop; float GuardBandRight; float GuardBandBottom; float ExtentsAdjust; DWORD StencilCaps; DWORD FVFCaps; DWORD TextureOpCaps; WORD MaxTextureBlendStages; WORD MaxSimultaneousTextures; DWORD VertexProcessingCaps; DWORD MaxActiveLights; WORD MaxUserClipPlanes; WORD MaxVertexBlendMatrices; DWORD MaxVertexBlendMatrixIndex; float MaxPointSize; DWORD MaxPrimitiveCount; DWORD MaxVertexIndex; DWORD MaxStreams; DWORD MaxStreamStride; DWORD VertexShaderVersion; DWORD MaxVertexShaderConst; DWORD PixelShaderVersion; float MaxPixelShaderValue; } D3DCAPS8;",
                        "typedef struct _D3DPRESENT_PARAMETERS_ { UINT BackBufferWidth; UINT BackBufferHeight; D3DFORMAT BackBufferFormat; UINT BackBufferCount; int MultiSampleType; DWORD SwapEffect; HWND hDeviceWindow; BOOL Windowed; BOOL EnableAutoDepthStencil; D3DFORMAT AutoDepthStencilFormat; DWORD Flags; UINT FullScreen_RefreshRateInHz; UINT FullScreen_PresentationInterval; } D3DPRESENT_PARAMETERS;",
                        "typedef struct _D3DLOCKED_RECT { int Pitch; void* pBits; } D3DLOCKED_RECT;",
                        "typedef struct _D3DSURFACE_DESC { D3DFORMAT Format; int Type; DWORD Usage; D3DPOOL Pool; UINT Size; int MultiSampleType; UINT Width; UINT Height; } D3DSURFACE_DESC;",
                        "struct IDirect3DBaseTexture8 { virtual ~IDirect3DBaseTexture8() {} ULONG Release() { delete this; return 0; } };",
                        "typedef IDirect3DBaseTexture8* LPDIRECT3DBaseTexture8;",
                        "typedef IDirect3DBaseTexture8* LPDIRECT3DBASETEXTURE8;",
                        "struct IDirect3DSurface8 {",
                        "    UINT width, height;",
                        "    IDirect3DSurface8() : width(0), height(0) {}",
                        "    HRESULT LockRect(D3DLOCKED_RECT* pLockedRect, const RECT* pRect, DWORD Flags) { if(pLockedRect){ pLockedRect->Pitch=width*4; pLockedRect->pBits=malloc(width*height*4); } return S_OK; }",
                        "    HRESULT UnlockRect() { return S_OK; }",
                        "    HRESULT GetDesc(D3DSURFACE_DESC* pDesc) { if(pDesc){ pDesc->Width=width; pDesc->Height=height; } return S_OK; }",
                        "    ULONG Release() { delete this; return 0; }",
                        "};",
                        "typedef IDirect3DSurface8* LPDIRECT3DSURFACE8;",
                        "struct IDirect3DTexture8 : public IDirect3DBaseTexture8 {",
                        "    GLuint glId;",
                        "    UINT width, height;",
                        "    IDirect3DTexture8() : glId(0), width(0), height(0) {}",
                        "    HRESULT GetLevelDesc(UINT Level, D3DSURFACE_DESC* pDesc) { if(pDesc){ pDesc->Width=width; pDesc->Height=height; } return S_OK; }",
                        "    HRESULT GetSurfaceLevel(UINT Level, IDirect3DSurface8** ppSurfaceLevel) { if(ppSurfaceLevel){ *ppSurfaceLevel = new IDirect3DSurface8(); (*ppSurfaceLevel)->width=width; (*ppSurfaceLevel)->height=height; } return S_OK; }",
                        "    HRESULT LockRect(UINT Level, D3DLOCKED_RECT* pLockedRect, const RECT* pRect, DWORD Flags) { if(pLockedRect){ pLockedRect->Pitch=width*4; pLockedRect->pBits=malloc(width*height*4); } return S_OK; }",
                        "    HRESULT UnlockRect(UINT Level) { return S_OK; }",
                        "    ULONG Release() { if(glId) glDeleteTextures(1, &glId); delete this; return 0; }",
                        "};",
                        "typedef IDirect3DTexture8* LPDIRECT3DTEXTURE8;",
                        "struct IDirect3DVertexBuffer8 {",
                        "    GLuint glVbo;",
                        "    UINT length;",
                        "    std::vector<BYTE> data;",
                        "    IDirect3DVertexBuffer8(UINT len=0) : glVbo(0), length(len), data(len) { glGenBuffers(1, &glVbo); }",
                        "    HRESULT Lock(UINT OffsetToLock, UINT SizeToLock, BYTE** ppbData, DWORD Flags) { if(ppbData) *ppbData = data.data() + OffsetToLock; return S_OK; }",
                        "    HRESULT Unlock() { glBindBuffer(GL_ARRAY_BUFFER, glVbo); glBufferData(GL_ARRAY_BUFFER, length, data.data(), GL_STATIC_DRAW); return S_OK; }",
                        "    ULONG Release() { if(glVbo) glDeleteBuffers(1, &glVbo); delete this; return 0; }",
                        "};",
                        "typedef IDirect3DVertexBuffer8* LPDIRECT3DVERTEXBUFFER8;",
                        "struct IDirect3DIndexBuffer8 {",
                        "    GLuint glIbo;",
                        "    UINT length;",
                        "    std::vector<BYTE> data;",
                        "    IDirect3DIndexBuffer8(UINT len=0) : glIbo(0), length(len), data(len) { glGenBuffers(1, &glIbo); }",
                        "    HRESULT Lock(UINT OffsetToLock, UINT SizeToLock, BYTE** ppbData, DWORD Flags) { if(ppbData) *ppbData = data.data() + OffsetToLock; return S_OK; }",
                        "    HRESULT Unlock() { glBindBuffer(GL_ELEMENT_ARRAY_BUFFER, glIbo); glBufferData(GL_ELEMENT_ARRAY_BUFFER, length, data.data(), GL_STATIC_DRAW); return S_OK; }",
                        "    ULONG Release() { if(glIbo) glDeleteBuffers(1, &glIbo); delete this; return 0; }",
                        "};",
                        "typedef IDirect3DIndexBuffer8* LPDIRECT3DINDEXBUFFER8;",
                        "struct IDirect3DDevice8;",
                        "typedef struct IDirect3DDevice8* LPDIRECT3DDEVICE8;"
                    ]

                    gcode = gcode.replace(
                        "inline HRESULT D3DXCreateTexture(",
                        "#if 0\ninline HRESULT D3DXCreateTexture("
                    ).replace(
                        "#define D3DVSD_STREAM(s) (s)",
                        "#endif\n#define D3DVSD_STREAM(s) (s)"
                    )

                    gcode = gcode.replace(
                        "HRESULT CreateDevice(UINT, int, HWND hWnd, DWORD, D3DPRESENT_PARAMETERS*, IDirect3DDevice8** ppDevice) {",
                        "HRESULT CreateDevice(UINT, int, HWND hWnd, DWORD, D3DPRESENT_PARAMETERS*, IDirect3DDevice8** ppDevice);\n#if 0\nHRESULT OldCreateDevice() {"
                    ).replace(
                        "ULONG Release() { delete this; return 0; }",
                        "#endif\nULONG Release() { delete this; return 0; }",
                        1
                    )

                    bottom_lines = [
                        "#ifdef ENABLE_OPENGL",
                        "inline HRESULT IDirect3D8::CreateDevice(UINT, int, HWND hWnd, DWORD, D3DPRESENT_PARAMETERS*, IDirect3DDevice8** ppDevice) {",
                        "    *ppDevice = new IDirect3DDevice8();",
                        "    return S_OK;",
                        "}",
                        "inline HRESULT D3DXCreateTexture(LPDIRECT3DDEVICE8 pDevice, UINT Width, UINT Height, UINT MipLevels, DWORD Usage, D3DFORMAT Format, D3DPOOL Pool, LPDIRECT3DTEXTURE8* ppTexture) {",
                        "    return pDevice->CreateTexture(Width, Height, MipLevels, Usage, Format, Pool, ppTexture);",
                        "}",
                        "inline HRESULT D3DXCreateTextureFromFileInMemoryEx(LPDIRECT3DDEVICE8 pDevice, LPCVOID pSrcData, UINT SrcDataSize, UINT Width, UINT Height, UINT MipLevels, DWORD Usage, D3DFORMAT Format, D3DPOOL Pool, DWORD Filter, DWORD MipFilter, D3DCOLOR ColorKey, D3DXIMAGE_INFO* pSrcInfo, PALETTEENTRY* pPalette, LPDIRECT3DTEXTURE8* ppTexture) {",
                        "    if (pSrcInfo) {",
                        "        pSrcInfo->Width = (Width == D3DX_DEFAULT) ? 256 : Width;",
                        "        pSrcInfo->Height = (Height == D3DX_DEFAULT) ? 256 : Height;",
                        "        pSrcInfo->MipLevels = 1;",
                        "        pSrcInfo->Format = D3DFMT_A8R8G8B8;",
                        "    }",
                        "    return pDevice->CreateTexture(256, 256, 1, 0, D3DFMT_A8R8G8B8, D3DPOOL_MANAGED, ppTexture);",
                        "}",
                        "inline HRESULT D3DXLoadSurfaceFromSurface(LPDIRECT3DSURFACE8 pDestSurface, CONST PALETTEENTRY* pDestPalette, CONST RECT* pDestRect, LPDIRECT3DSURFACE8 pSrcSurface, CONST PALETTEENTRY* pSrcPalette, CONST RECT* pSrcRect, DWORD Filter, D3DCOLOR ColorKey) {",
                        "    return S_OK;",
                        "}",
                        "#endif"
                    ]

                    fixed_code = "\n".join(top_lines) + "\n" + gcode + "\n" + "\n".join(bottom_lines) + "\n"
                    with open(gpath, "w", encoding="latin-1") as f:
                        f.write(fixed_code)
                    print("GrpOpenGL.h TAMAMEN DUZELTILDI:", gpath)

        # 3. Kucuk harf ve camelCase kisayollar olustur
        for target in ["clientsource", "Extern"]:
            if not os.path.exists(target): continue
            for root, dirs, files in os.walk(target, topdown=False):
                for name in files + dirs:
                    variants = {
                        name.lower(),
                        name[0].lower() + name[1:] if len(name) > 1 else name.lower(),
                        name.replace("PRTerrainLib", "prTerrainLib").replace("CWebBrowser", "cWebBrowser")
                    }
                    for var in variants:
                        if name != var and not os.path.exists(os.path.join(root, var)):
                            try: os.symlink(name, os.path.join(root, var))
                            except: pass

        os.chdir("clientsource")
        real_paths = {}
        for root, dirs, files in os.walk("."):
            for name in dirs + files:
                rel = os.path.relpath(os.path.join(root, name), ".").replace("\\", "/")
                real_paths[rel.lower()] = rel

        with open("CMakeLists.txt", "r", encoding="utf-8", errors="ignore") as f:
            cmake = f.read().replace("\\", "/")

        def fix_path(match):
            val = match.group(0)
            low = val.lower()
            if low in real_paths:
                return real_paths[low]
            parts = val.split("/")
            if len(parts) == 2 and parts[0].lower() in real_paths:
                real_dir = real_paths[parts[0].lower()]
                comb = (real_dir + "/" + parts[1]).lower()
                if comb in real_paths:
                    return real_paths[comb]
            return val

        cmake = re.sub(r"[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)+", fix_path, cmake)
        extra_flags = '\nadd_compile_options(-fms-extensions -fdeclspec -Wno-error -Wno-everything)\n'
        cmake = extra_flags + cmake

        with open("CMakeLists.txt", "w", encoding="utf-8") as f:
            f.write(cmake)

        inc_pattern = re.compile(r"(#\s*include\s*[\"<])([^\"<>]+)([\">])")
        for root, _, files in os.walk("."):
            for fname in files:
                if fname.endswith((".cpp", ".c", ".h", ".hpp", ".inl")):
                    fpath = os.path.join(root, fname)
                    try:
                        with open(fpath, "r", encoding="latin-1") as f:
                            content = f.read()
                        new_content = inc_pattern.sub(lambda m: m.group(1) + m.group(2).replace("\\", "/") + m.group(3), content)
                        if new_content != content:
                            with open(fpath, "w", encoding="latin-1") as f:
                                f.write(new_content)
                    except: pass
        EOF
        
        python3 fix_all.py > fix_log.txt 2>&1
        
        cd android
        set +e
        gradle assembleDebug > build_log.txt 2>&1
        EXIT_CODE=$?
        if [ $EXIT_CODE -ne 0 ]; then
          echo "================ GERCEK HATA BURADA ================"
          grep -i -E "error:|fatal error:|cannot find|undefined reference|CMake Error|FAILURE:" build_log.txt -B 1 -A 2 | head -n 55
          echo "---------------- DOSYA YAPISI (600-SONU) ----------------"
          cat ../fix_log.txt | head -n 160
          echo "========================================================="
          exit $EXIT_CODE
        fi
        cat build_log.txt | tail -n 30

    - name: Uretilen APK Dosyasini Yukle
      uses: actions/upload-artifact@v4
      with:
        name: Metin2-Mobil-APK
        path: ./Cross Platform/opengl/android/app/build/outputs/apk/debug/*.apk
