        inline GLMATRIX* D3DXMatrixRotationYawPitchRoll(GLMATRIX* pOut, float y, float p, float r) {
            GLMATRIX my, mp, mr;
            D3DXMatrixRotationY(&my, y); D3DXMatrixRotationX(&mp, p); D3DXMatrixRotationZ(&mr, r);
            D3DXMatrixMultiply(pOut, &mr, &mp); D3DXMatrixMultiply(pOut, pOut, &my);
            return pOut;
        }
