            return pOut;
        }
        inline GLMATRIX* D3DXMatrixRotationX(GLMATRIX* pOut, float angle) {
            float s = sinf(angle), c = cosf(angle);
            D3DXMatrixIdentity(pOut);
            pOut->m[1][1] = c; pOut->m[1][2] = s; pOut->m[2][1] = -s; pOut->m[2][2] = c;
            return pOut;
        }
        inline GLMATRIX* D3DXMatrixRotationY(GLMATRIX* pOut, float angle) {
            float s = sinf(angle), c = cosf(angle);
            D3DXMatrixIdentity(pOut);
            pOut->m[0][0] = c; pOut->m[0][2] = -s; pOut->m[2][0] = s; pOut->m[2][2] = c;
            return pOut;
        }
