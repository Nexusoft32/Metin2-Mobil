        inline GLVECTOR3* D3DXVec3Rotation(GLVECTOR3* pOut, const GLVECTOR3* pV, const GLQUATERNION* pQ) { *pOut = *pV; return pOut; }
        inline GLVECTOR3* D3DXVec3Translation(GLVECTOR3* pOut, const GLVECTOR3* pV, const GLMATRIX* pM) { *pOut = *pV; return pOut; }
        inline float D3DXPlaneDotCoord(const GLPLANE* pP, const GLVECTOR3* pV) { return pP->a * pV->x + pP->b * pV->y + pP->c * pV->z + pP->d; }
        inline float D3DXPlaneDotNormal(const GLPLANE* pP, const GLVECTOR3* pV) { return pP->a * pV->x + pP->b * pV->y + pP->c * pV->z; }
        inline GLPLANE* D3DXPlaneFromPoints(GLPLANE* pOut, const GLVECTOR3* pV1, const GLVECTOR3* pV2, const GLVECTOR3* pV3) { return pOut; }
        inline GLPLANE* D3DXPlaneFromPointNormal(GLPLANE* pOut, const GLVECTOR3* pPoint, const GLVECTOR3* pNormal) { return pOut; }
        inline GLPLANE* D3DXPlaneNormalize(GLPLANE* pOut, const GLPLANE* pP) { *pOut = *pP; return pOut; }
        inline GLPLANE* D3DXPlaneTransform(GLPLANE* pOut, const GLPLANE* pP, const GLMATRIX* pM) { *pOut = *pP; return pOut; }
        inline GLVECTOR3* D3DXPlaneIntersectLine(GLVECTOR3* pOut, const GLPLANE* pP, const GLVECTOR3* pV1, const GLVECTOR3* pV2) { *pOut = *pV1; return pOut; }
        inline float D3DXMatrixfDeterminant(const GLMATRIX* pM) { return 1.0f; }
        inline GLMATRIX* D3DXMatrixLookAtRH(GLMATRIX* pOut, const GLVECTOR3* pEye, const GLVECTOR3* pAt, const GLVECTOR3* pUp) {
            GLVECTOR3 f, s, u, tmp(pAt->x - pEye->x, pAt->y - pEye->y, pAt->z - pEye->z);
            D3DXVec3Normalize(&f, &tmp);
            D3DXVec3Cross(&s, &f, pUp);
            D3DXVec3Normalize(&s, &s);
            D3DXVec3Cross(&u, &s, &f);
            D3DXMatrixIdentity(pOut);
            pOut->m[0][0] = s.x; pOut->m[1][0] = s.y; pOut->m[2][0] = s.z;
            pOut->m[0][1] = u.x; pOut->m[1][1] = u.y; pOut->m[2][1] = u.z;
            pOut->m[0][2] = -f.x; pOut->m[1][2] = -f.y; pOut->m[2][2] = -f.z;
            pOut->m[3][0] = -D3DXVec3Dot(&s, pEye);
            pOut->m[3][1] = -D3DXVec3Dot(&u, pEye);
            pOut->m[3][2] = D3DXVec3Dot(&f, pEye);
            return pOut;
        }
        inline GLMATRIX* D3DXMatrixLookAtLH(GLMATRIX* pOut, const GLVECTOR3* pEye, const GLVECTOR3* pAt, const GLVECTOR3* pUp) {
