        struct GLCOLOR {
            float r, g, b, a;
            GLCOLOR() : r(0), g(0), b(0), a(1) {}
            GLCOLOR(float _r, float _g, float _b, float _a = 1.0f) : r(_r), g(_g), b(_b), a(_a) {}
            GLCOLOR(DWORD dw) {
                a = ((dw >> 24) & 0xff) / 255.0f;
                r = ((dw >> 16) & 0xff) / 255.0f;
                g = ((dw >> 8) & 0xff) / 255.0f;
                b = (dw & 0xff) / 255.0f;
            }
            operator DWORD() const {
                DWORD dwA = (DWORD)(a * 255.0f) & 0xff;
                DWORD dwR = (DWORD)(r * 255.0f) & 0xff;
                DWORD dwG = (DWORD)(g * 255.0f) & 0xff;
                DWORD dwB = (DWORD)(b * 255.0f) & 0xff;
                return (dwA << 24) | (dwR << 16) | (dwG << 8) | dwB;
            }
            operator float*() { return &r; }
            operator const float*() const { return &r; }
        };

