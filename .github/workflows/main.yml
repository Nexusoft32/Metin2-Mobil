            "tgmath.h", "uchar.h", "unistd.h", "utime.h", "wchar.h", "wctype.h"
        }

        for target in ["clientsource", "Extern"]:
            if not os.path.exists(target): continue
            for root, dirs, files in os.walk(target, topdown=False):
                for name in dirs:
                    variants = {
                        name.lower(),
                        name[0].lower() + name[1:] if len(name) > 1 else name.lower(),
                        name.replace("PRTerrainLib", "prTerrainLib").replace("CWebBrowser", "cWebBrowser")
                    }
                    for var in variants:
                        if name != var and not os.path.exists(os.path.join(root, var)):
                            try: os.symlink(name, os.path.join(root, var))
                            except: pass
                for name in files:
                    if name.lower() in sys_headers:
                        continue
                    variants = {
                        name.lower(),
                        name[0].lower() + name[1:] if len(name) > 1 else name.lower()
                    }
                    for var in variants:
                        if var.lower() in sys_headers:
                            continue
                        if name != var and not os.path.exists(os.path.join(root, var)):
                            try: os.symlink(name, os.path.join(root, var))
                            except: pass

        os.chdir("clientsource")
        real_paths = {}
        for root, dirs, files in os.walk("."):
            for name in dirs + files:
                rel = os.path.relpath(os.path.join(root, name), ".").replace("\\", "/")
                real_paths[rel.lower()] = rel

        with open("CMakeLists.txt", "r", encoding="utf-8", errors="ignore") as f:
            cmake = f.read().replace("\\", "/")

        def fix_path(match):
            val = match.group(0)
            low = val.lower()
            if low in real_paths:
                return real_paths[low]
            parts = val.split("/")
            if len(parts) == 2 and parts[0].lower() in real_paths:
                real_dir = real_paths[parts[0].lower()]
                comb = (real_dir + "/" + parts[1]).lower()
                if comb in real_paths:
                    return real_paths[comb]
            return val

        cmake = re.sub(r"[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)+", fix_path, cmake)
        extra_flags = '\nadd_compile_options(-fms-extensions -fdeclspec -fpermissive -Wno-error -Wno-everything)\n'
        cmake = extra_flags + cmake

        with open("CMakeLists.txt", "w", encoding="utf-8") as f:
            f.write(cmake)
        print("PYTHON DUZELTMELERI TAMAMLANDI!")

    - name: APK Derle
      working-directory: ./Cross Platform/opengl/android
      run: |
        rm -f local.properties
        set +e
        gradle assembleDebug > build_log.txt 2>&1
        EXIT_CODE=$?
        if [ $EXIT_CODE -ne 0 ]; then
          echo "================ DERLENEN DOSYA DURUMU ================"
          grep -E "\[[0-9]+/[0-9]+\] Building CXX" build_log.txt | tail -n 25
          echo "================ GERCEK HATA BURADA ================"
          grep -i -E "error:|fatal error:|cannot find|undefined reference|CMake Error|FAILURE:" build_log.txt -B 1 -A 2 | head -n 65
          echo "======================================================="
          exit $EXIT_CODE
        fi
        cat build_log.txt | tail -n 30

    - name: Uretilen APK Dosyasini Yukle
      uses: actions/upload-artifact@v4
      with:
        name: Metin2-Mobil-APK
        path: ./Cross Platform/opengl/android/app/build/outputs/apk/debug/*.apk
