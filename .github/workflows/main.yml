            float s = sinf(angle), c = cosf(angle);
            D3DXMatrixIdentity(pOut);
            pOut->m[0][0] = c; pOut->m[0][1] = s; pOut->m[1][0] = -s; pOut->m[1][1] = c;
            return pOut;
        }
