        inline GLMATRIX* D3DXMatrixPerspectiveFovRH(GLMATRIX* pOut, float fovy, float Aspect, float zn, float zf) {
            float h = 1.0f / tanf(fovy / 2.0f), w = h / Aspect;
            D3DXMatrixIdentity(pOut);
            pOut->m[0][0] = w; pOut->m[1][1] = h; pOut->m[2][2] = zf / (zn - zf); pOut->m[2][3] = -1.0f; pOut->m[3][2] = (zn * zf) / (zn - zf); pOut->m[3][3] = 0.0f;
            return pOut;
        }
        inline GLMATRIX* D3DXMatrixPerspectiveFovLH(GLMATRIX* pOut, float fovy, float Aspect, float zn, float zf) {
