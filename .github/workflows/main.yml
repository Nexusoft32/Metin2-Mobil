        inline GLMATRIX* D3DXMatrixPerspectiveFovRH(GLMATRIX* pOut, float fovy, float Aspect, float zn, float zf) {
            float h = 1.0f / tanf(fovy / 2.0f), w = h / Aspect;
            D3DXMatrixIdentity(pOut);
            pOut->m[0][0] = w; pOut->m[1][1] = h; pOut->m[2][2] = zf / (zn - zf); pOut->m[2][3] = -1.0f; pOut->m[3][2] = (zn * zf) / (zn - zf); pOut->m[3][3] = 0.0f;
            return pOut;
        }
        inline GLMATRIX* D3DXMatrixPerspectiveFovLH(GLMATRIX* pOut, float fovy, float Aspect, float zn, float zf) {
            return D3DXMatrixPerspectiveFovRH(pOut, fovy, Aspect, zn, zf);
        }
        inline GLMATRIX* D3DXMatrixOrthoRH(GLMATRIX* pOut, float w, float h, float zn, float zf) {
            D3DXMatrixIdentity(pOut);
            pOut->m[0][0] = 2.0f / w; pOut->m[1][1] = 2.0f / h; pOut->m[2][2] = 1.0f / (zn - zf); pOut->m[3][2] = zn / (zn - zf);
            return pOut;
        }
        inline GLMATRIX* D3DXMatrixOrthoOffCenterRH(GLMATRIX* pOut, float l, float r, float b, float t, float zn, float zf) {
            D3DXMatrixIdentity(pOut);
            if (r != l) pOut->m[0][0] = 2.0f / (r - l);
            if (t != b) pOut->m[1][1] = 2.0f / (t - b);
            if (zn != zf) { pOut->m[2][2] = 1.0f / (zn - zf); pOut->m[3][2] = zn / (zn - zf); }
            if (r != l) pOut->m[3][0] = (l + r) / (l - r);
            if (t != b) pOut->m[3][1] = (t + b) / (b - t);
            return pOut;
        }
        inline GLMATRIX* D3DXMatrixOrthoOffCenterLH(GLMATRIX* pOut, float l, float r, float b, float t, float zn, float zf) {
            return D3DXMatrixOrthoOffCenterRH(pOut, l, r, b, t, zn, zf);
        }
