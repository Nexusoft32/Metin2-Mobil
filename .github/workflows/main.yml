name: Metin2 Android APK Uretici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kaynak Kodlari Cek
      uses: actions/checkout@v4

    - name: Java JDK 21 Kur
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Android Lisanslarini Otomatik Onayla
      run: |
        yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Gradle 8.13 Kur
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.13'

    - name: Dosya Harflerini Duzelt ve APK Derle
      working-directory: ./Cross Platform/opengl/android
      run: |
        rm -f local.properties
        cd ..
        
        # 1. Sadece clientsource ve Extern icindeki tum klasor ve dosyalarin kucuk harfli kopyasini olustur (Java'ya dokunmaz!)
        find clientsource Extern -depth | while read -r path; do
          dir=$(dirname "$path")
          base=$(basename "$path")
          low=$(echo "$base" | tr '[:upper:]' '[:lower:]')
          if [ "$base" != "$low" ] && [ ! -e "$dir/$low" ]; then
            ln -s "$base" "$dir/$low" || true
          fi
        done

        # 2. CMakeLists.txt icindeki ters slaslari ve harf uyumsuzluklarini duzelt
        cd clientsource
        sed -i 's/\\/\//g' CMakeLists.txt
        sed -i 's/eterPack\/eterPack.cpp/eterPack\/EterPack.cpp/gI' CMakeLists.txt
        sed -i 's/userinterface/UserInterface/gI' CMakeLists.txt

        # 3. APK Derlemesini Baslat
        cd ../android
        set +e
        gradle assembleDebug > build_log.txt 2>&1
        EXIT_CODE=$?
        if [ $EXIT_CODE -ne 0 ]; then
          echo "================ GERCEK HATA BURADA ================"
          grep -i -E "error:|fatal error:|cannot find|undefined reference|CMake Error|FAILURE:" build_log.txt -B 2 -A 5 | tail -n 100
          echo "===================================================="
          exit $EXIT_CODE
        fi
        cat build_log.txt | tail -n 30

    - name: Uretilen APK Dosyasini Yukle
      uses: actions/upload-artifact@v4
      with:
        name: Metin2-Mobil-APK
        path: ./Cross Platform/opengl/android/app/build/outputs/apk/debug/*.apk
