name: Metin2 Android APK Uretici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kaynak Kodlari Cek
      uses: actions/checkout@v4

    - name: Java JDK 21 Kur
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Android Lisanslarini Otomatik Onayla
      run: |
        yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Gradle 8.13 Kur
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.13'

    - name: Tum Dosya Harflerini Otomatik Eslestir ve APK Derle
      working-directory: ./Cross Platform/opengl/android
      run: |
        rm -f local.properties
        cd ..
        
        python3 -c '
        import os, re

        # 1. CMakeLists.txt icindeki TUM dosya ve klasor yollarini gercek adlariyla otomatik degistir
        os.chdir("clientsource")
        real_paths = {}
        real_names = {}
        for root, dirs, files in os.walk("."):
            for name in dirs + files:
                rel = os.path.relpath(os.path.join(root, name), ".").replace("\\", "/")
                real_paths[rel.lower()] = rel
                real_names[name.lower()] = name

        with open("CMakeLists.txt", "r", encoding="utf-8", errors="ignore") as f:
            cmake = f.read().replace("\\", "/")

        def fix_cmake_path(match):
            val = match.group(0)
            low = val.lower()
            if low in real_paths:
                return real_paths[low]
            parts = val.split("/")
            if len(parts) == 2 and parts[0].lower() in real_paths:
                real_dir = real_paths[parts[0].lower()]
                comb = (real_dir + "/" + parts[1]).lower()
                if comb in real_paths:
                    return real_paths[comb]
            return val

        cmake = re.sub(r"[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)+", fix_cmake_path, cmake)

        with open("CMakeLists.txt", "w", encoding="utf-8") as f:
            f.write(cmake)

        # 2. C++ kodlarinin icindeki #include satirlarindaki harf uyumsuzluklarini da duzelt
        os.chdir("..")
        for target in ["clientsource", "Extern"]:
            if not os.path.exists(target): continue
            for root, dirs, files in os.walk(target, topdown=False):
                for name in files + dirs:
                    low = name.lower()
                    if name != low and not os.path.exists(os.path.join(root, low)):
                        try: os.symlink(name, os.path.join(root, low))
                        except: pass
        '
        
        cd android
        set +e
        gradle assembleDebug > build_log.txt 2>&1
        EXIT_CODE=$?
        if [ $EXIT_CODE -ne 0 ]; then
          echo "================ GERCEK HATA BURADA ================"
          grep -i -E "error:|fatal error:|cannot find|undefined reference|CMake Error|FAILURE:" build_log.txt -B 2 -A 5 | tail -n 100
          echo "===================================================="
          exit $EXIT_CODE
        fi
        cat build_log.txt | tail -n 30

    - name: Uretilen APK Dosyasini Yukle
      uses: actions/upload-artifact@v4
      with:
        name: Metin2-Mobil-APK
        path: ./Cross Platform/opengl/android/app/build/outputs/apk/debug/*.apk
