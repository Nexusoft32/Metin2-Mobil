name: Metin2 Android APK Uretici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kaynak Kodlari Cek
      uses: actions/checkout@v4

    - name: Java JDK 21 Kur
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Android Lisanslarini Otomatik Onayla
      run: |
        yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Gradle 8.13 Kur
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.13'

    - name: Tum C++ Dosyalarini ve GrpOpenGL Yapisini Duzelt
      working-directory: ./Cross Platform/opengl/android
      run: |
        rm -f local.properties
        cd ..
        
        cat << 'EOF' > fix_all.py
        import os, re

        # 1. clientsource ve Extern icindeki tum dosyalarda tip cakismalarini ve include hatalarini duzelt
        for target_root in ["clientsource", "Extern"]:
            if not os.path.exists(target_root): continue
            for root, dirs, files in os.walk(target_root):
                for fname in files:
                    if not fname.endswith((".h", ".cpp", ".c", ".hpp", ".inl")): continue
                    fpath = os.path.join(root, fname)
                    try:
                        with open(fpath, "r", encoding="latin-1") as f:
                            content = f.read()
                    except:
                        continue

                    orig = content

                    # a) #include satirlarindaki ters slaslari (\\) duzelt ve <SSTREAM> gibi buyuk harfli standart kutuphaneleri kucult
                    def fix_includes(m):
                        prefix, inc_path, suffix = m.group(1), m.group(2).replace("\\", "/"), m.group(3)
                        if inc_path.isupper() and "/" not in inc_path and "." not in inc_path:
                            inc_path = inc_path.lower()
                        return prefix + inc_path + suffix

                    content = re.sub(r"(#\s*include\s*[\"<])([^\"<>]+)([\">])", fix_includes, content)

                    # b) Granny 64-bit (sizeof(void*) == 4) kilidini devre disi birak
                    if fname.lower() == "granny.h":
                        content = re.sub(r"GrannyTypeSizeCheck\s*\([^;]+\)\s*;", "// GrannyTypeSizeCheck disabled", content)

                    # c) DWORD, HANDLE, RECT, POINT, PALETTEENTRY, D3DXIMAGE_INFO, D3DVIEWPORT8 cakismalarini koruma altina al
                    content = content.replace("typedef unsigned long DWORD;", "typedef uint32_t DWORD;")
                    content = content.replace("typedef unsigned long       DWORD;", "typedef uint32_t DWORD;")
                    content = content.replace("typedef int HANDLE;", "#ifndef HANDLE_DEFINED\n#define HANDLE_DEFINED\ntypedef void* HANDLE;\n#endif")
                    content = content.replace("typedef void* HANDLE;", "#ifndef HANDLE_DEFINED\n#define HANDLE_DEFINED\ntypedef void* HANDLE;\n#endif")

                    if fname.lower() in ["stdafx.h", "windows.h"]:
                        content = re.sub(
                            r"typedef\s+struct\s*(?:tagRECT|RECT|_RECT)?\s*\{[^}]*left[^}]*\}\s*RECT[^;]*;",
                            "#ifndef RECT_DEFINED\n#define RECT_DEFINED\ntypedef struct tagRECT { LONG left; LONG top; LONG right; LONG bottom; } RECT, *PRECT, *LPRECT;\n#endif",
                            content
                        )
                        content = re.sub(
                            r"typedef\s+struct\s*(?:tagPOINT|POINT|_POINT)?\s*\{[^}]*LONG\s+x[^}]*\}\s*POINT[^;]*;",
                            "#ifndef POINT_DEFINED\n#define POINT_DEFINED\ntypedef struct tagPOINT { LONG x; LONG y; } POINT, *PPOINT, *LPPOINT;\n#endif",
                            content
                        )
                        content = re.sub(
                            r"typedef\s+struct\s*(?:_PALETTEENTRY)?\s*\{[^}]*peRed[^}]*\}\s*PALETTEENTRY[^;]*;",
                            "#ifndef PALETTEENTRY_DEFINED\n#define PALETTEENTRY_DEFINED\ntypedef struct _PALETTEENTRY { BYTE peRed; BYTE peGreen; BYTE peBlue; BYTE peFlags; } PALETTEENTRY;\n#endif",
                            content
                        )
                        content = re.sub(
                            r"typedef\s+struct\s*(?:_D3DXIMAGE_INFO)?\s*\{[^}]*MipLevels[^}]*\}\s*D3DXIMAGE_INFO[^;]*;",
                            "#ifndef D3DXIMAGE_INFO_DEFINED\n#define D3DXIMAGE_INFO_DEFINED\ntypedef struct _D3DXIMAGE_INFO { UINT Width; UINT Height; UINT Depth; UINT MipLevels; uint32_t Format; int ResourceType; int ImageFileFormat; } D3DXIMAGE_INFO;\n#endif",
                            content
                        )
                        content = re.sub(
                            r"typedef\s+struct\s*_D3DVIEWPORT8\s*\{[^}]*MinZ[^}]*\}\s*D3DVIEWPORT8[^;]*;",
                            "#ifndef D3DVIEWPORT8_DEFINED\n#define D3DVIEWPORT8_DEFINED\ntypedef struct _D3DVIEWPORT8 { DWORD X; DWORD Y; DWORD Width; DWORD Height; float MinZ; float MaxZ; } D3DVIEWPORT8;\n#endif",
                            content
                        )
                        content = content.replace("typedef uint32_t D3DFORMAT;", "#ifndef D3DFORMAT_DEFINED\n#define D3DFORMAT_DEFINED\ntypedef uint32_t D3DFORMAT;\n#endif")
                        content = content.replace("typedef uint32_t D3DPOOL;", "#ifndef D3DPOOL_DEFINED\n#define D3DPOOL_DEFINED\ntypedef uint32_t D3DPOOL;\n#endif")

                    # d) EterBase/Utils.h icindeki PCHAR ve eksik typename hatalarini duzelt
                    if fname.lower() == "utils.h":
                        content = "#ifndef PCHAR_DEFINED\n#define PCHAR_DEFINED\ntypedef char* PCHAR;\n#endif\n" + content
                        content = re.sub(r"(?<!typename\s)\bC::const_iterator\b", "typename C::const_iterator", content)

                    if content != orig:
                        with open(fpath, "w", encoding="latin-1") as f:
                            f.write(content)

