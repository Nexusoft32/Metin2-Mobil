name: Metin2 Android APK Uretici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kaynak Kodlari Cek
      uses: actions/checkout@v4

    - name: Java JDK 21 Kur
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Android Lisanslarini Otomatik Onayla
      run: |
        yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Gradle 8.13 Kur
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.13'

    - name: C++ Windows/DirectX Uyumlulugunu Yamala ve APK Derle
      working-directory: ./Cross Platform/opengl/android
      run: |
        rm -f local.properties
        cd ..
        
        cat << 'EOF' > fix_all.py
        import os, re

        # 1. GrpOpenGL.h ve windows.h dosyalarini sembolik linklerden ONCE gercek yollariyla bul ve yamala
        for root, dirs, files in os.walk("clientsource"):
            for fname in files:
                if fname.lower() == "windows.h" and "android_compat" in root.lower():
                    wpath = os.path.join(root, fname)
                    with open(wpath, "r", encoding="latin-1") as f:
                        wcode = f.read()
                    wcode = wcode.replace("typedef uint32_t DWORD;", "typedef unsigned long DWORD;")
                    with open(wpath, "w", encoding="latin-1") as f:
                        f.write(wcode)

                if fname.lower() == "grpopengl.h":
                    gpath = os.path.join(root, fname)
                    with open(gpath, "r", encoding="latin-1") as f:
                        gcode = f.read()

                    print("=== GRPOPENGL.H 300-800 ARASI ===")
                    for i, line in enumerate(gcode.splitlines()[299:800], 300):
                        print(f"{i}: {line}")
                    print("=================================")

                    # Dosyanin altinda tanimlanan ama ustte kullanilan makrolari ve tipleri en basa ekle
                    top_patch = """#pragma once
#include <stdint.h>
#include <stdlib.h>
#include <string.h>
typedef unsigned char BYTE;
typedef unsigned short WORD;
typedef unsigned long DWORD;
typedef unsigned long ULONG;
typedef int32_t LONG;
typedef unsigned int UINT;
typedef int BOOL;
typedef long HRESULT;
typedef const void* LPCVOID;
typedef void* LPVOID;
typedef void* HWND;
#ifndef CONST
#define CONST const
#endif
#ifndef S_OK
#define S_OK ((HRESULT)0L)
#endif
#ifndef D3DFMT_A8R8G8B8
#define D3DFMT_A8R8G8B8 21
#endif
#ifndef D3DPOOL_MANAGED
#define D3DPOOL_MANAGED 1
#endif
#ifndef D3DDEVCAPS_HWTRANSFORMANDLIGHT
#define D3DDEVCAPS_HWTRANSFORMANDLIGHT 0x00010000L
#define D3DCAPS2_CANRENDERWINDOWED 0x00080000L
#define D3DVTXPCAPS_DIRECTIONALLIGHTS 0x00000008L
#define D3DVTXPCAPS_POSITIONALLIGHTS 0x00000010L
#define D3DVTXPCAPS_TEXGEN 0x00000001L
#define D3DPMISCCAPS_CLIPTLVERTS 0x00000200L
#define D3DPTADDRESSCAPS_BORDER 0x00000008L
#endif
"""
                    # Eger dosya icinde asagida tanimlanan struct/class varsa ve yukarida kullaniliyorsa:
                    # 325-415. satirlardaki erken kullanilan fonksiyonlari dosyanin en sonuna tasiyalim!
                    lines = gcode.splitlines()
                    early_funcs = []
                    new_lines = []
                    in_early = False
                    for line in lines:
                        if "inline HRESULT D3DXCreateTexture(" in line or "inline HRESULT D3DXCreateTextureFromFileInMemoryEx(" in line or "inline HRESULT D3DXLoadSurfaceFromSurface(" in line:
                            in_early = True
                        if in_early:
                            early_funcs.append(line)
                            if line.strip() == "}":
                                in_early = False
                        else:
                            new_lines.append(line)

                    fixed_code = top_patch + "\n" + "\n".join(new_lines) + "\n" + "\n".join(early_funcs) + "\n"
                    with open(gpath, "w", encoding="latin-1") as f:
                        f.write(fixed_code)
                    print("GrpOpenGL.h BASARIYLA YAMALANDI:", gpath)

        # 2. Tum klasor ve dosyalar icin kucuk harf ve camelCase kisayollar olustur
        for target in ["clientsource", "Extern"]:
            if not os.path.exists(target): continue
            for root, dirs, files in os.walk(target, topdown=False):
                for name in files + dirs:
                    variants = {
                        name.lower(),
                        name[0].lower() + name[1:] if len(name) > 1 else name.lower(),
                        name.replace("PRTerrainLib", "prTerrainLib").replace("CWebBrowser", "cWebBrowser")
                    }
                    for var in variants:
                        if name != var and not os.path.exists(os.path.join(root, var)):
                            try: os.symlink(name, os.path.join(root, var))
                            except: pass

        os.chdir("clientsource")
        real_paths = {}
        for root, dirs, files in os.walk("."):
            for name in dirs + files:
                rel = os.path.relpath(os.path.join(root, name), ".").replace("\\", "/")
                real_paths[rel.lower()] = rel

        # 3. CMakeLists.txt icindeki yollari duzelt ve Windows uyumluluk bayraklarini ekle
        with open("CMakeLists.txt", "r", encoding="utf-8", errors="ignore") as f:
            cmake = f.read().replace("\\", "/")

        def fix_path(match):
            val = match.group(0)
            low = val.lower()
            if low in real_paths:
                return real_paths[low]
            parts = val.split("/")
            if len(parts) == 2 and parts[0].lower() in real_paths:
                real_dir = real_paths[parts[0].lower()]
                comb = (real_dir + "/" + parts[1]).lower()
                if comb in real_paths:
                    return real_paths[comb]
            return val

        cmake = re.sub(r"[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)+", fix_path, cmake)
        extra_flags = '\nadd_compile_options(-fms-extensions -fdeclspec -Wno-error -Wno-everything)\n'
        cmake = extra_flags + cmake

        with open("CMakeLists.txt", "w", encoding="utf-8") as f:
            f.write(cmake)

        # 4. C/C++ #include satirlarindaki ters slaslari duzelt
        inc_pattern = re.compile(r"(#\s*include\s*[\"<])([^\"<>]+)([\">])")
        for root, _, files in os.walk("."):
            for fname in files:
                if fname.endswith((".cpp", ".c", ".h", ".hpp", ".inl")):
                    fpath = os.path.join(root, fname)
                    try:
                        with open(fpath, "r", encoding="latin-1") as f:
                            content = f.read()
                        new_content = inc_pattern.sub(lambda m: m.group(1) + m.group(2).replace("\\", "/") + m.group(3), content)
                        if new_content != content:
                            with open(fpath, "w", encoding="latin-1") as f:
                                f.write(new_content)
                    except: pass
        EOF
        
        python3 fix_all.py > fix_log.txt 2>&1
        
        cd android
        set +e
        gradle assembleDebug > build_log.txt 2>&1
        EXIT_CODE=$?
        if [ $EXIT_CODE -ne 0 ]; then
          echo "================ GERCEK HATA BURADA ================"
          grep -i -E "error:|fatal error:|cannot find|undefined reference|CMake Error|FAILURE:" build_log.txt -B 1 -A 2 | head -n 45
          echo "---------------- DOSYA YAPISI (300-800) ----------------"
          cat ../fix_log.txt | head -n 160
          echo "========================================================"
          exit $EXIT_CODE
        fi
        cat build_log.txt | tail -n 30

    - name: Uretilen APK Dosyasini Yukle
      uses: actions/upload-artifact@v4
      with:
        name: Metin2-Mobil-APK
        path: ./Cross Platform/opengl/android/app/build/outputs/apk/debug/*.apk
