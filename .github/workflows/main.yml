name: Metin2 Android APK Uretici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kaynak Kodlari Cek
      uses: actions/checkout@v4

    - name: Java JDK 21 Kur
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Android Lisanslarini Otomatik Onayla
      run: |
        yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Gradle 8.13 Kur
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.13'

    - name: C++ Dosyalarini ve GrpOpenGL Yapisini Duzelt
      working-directory: ./Cross Platform/opengl
      shell: python
      run: |
        import os, re

        # 1. Eksik Windows baslik dosyalarini (io.h, direct.h, process.h vb.) android_compat icine olustur
        compat_dir = "clientsource/android_compat"
        os.makedirs(compat_dir, exist_ok=True)

        compat_files = {
            "io.h": """#pragma once
        #include <unistd.h>
        #include <fcntl.h>
        #include <sys/stat.h>
        #include <sys/types.h>
        #ifndef _access
        #define _access access
        #endif
        #ifndef _close
        #define _close close
        #endif
        #ifndef _read
        #define _read read
        #endif
        #ifndef _write
        #define _write write
        #endif
        #ifndef _open
        #define _open open
        #endif
        #ifndef _lseek
        #define _lseek lseek
        #endif
        #ifndef _tell
        #define _tell(fd) lseek(fd, 0, SEEK_CUR)
        #endif
        """,
            "direct.h": """#pragma once
        #include <unistd.h>
        #include <sys/stat.h>
        #include <sys/types.h>
        #ifndef _mkdir
        #define _mkdir(p) mkdir(p, 0777)
        #endif
        #ifndef _getcwd
        #define _getcwd getcwd
        #endif
        #ifndef _chdir
        #define _chdir chdir
        #endif
        """,
            "process.h": """#pragma once
        #include <unistd.h>
        #include <stdlib.h>
        """,
            "crtdbg.h": """#pragma once
        #ifndef _ASSERT
        #define _ASSERT(x)
        #endif
        #ifndef _ASSERTE
        #define _ASSERTE(x)
        #endif
        """,
            "basetsd.h": """#pragma once
        #include <stdint.h>
        typedef intptr_t INT_PTR, *PINT_PTR;
        typedef uintptr_t UINT_PTR, *PUINT_PTR;
        typedef intptr_t LONG_PTR, *PLONG_PTR;
        typedef uintptr_t ULONG_PTR, *PULONG_PTR;
        typedef ULONG_PTR DWORD_PTR, *PDWORD_PTR;
        typedef ULONG_PTR SIZE_T, *PSIZE_T;
        typedef LONG_PTR SSIZE_T, *PSSIZE_T;
        """
        }

        for cf_name, cf_body in compat_files.items():
            cf_path = os.path.join(compat_dir, cf_name)
            if not os.path.exists(cf_path):
                with open(cf_path, "w", encoding="latin-1") as f:
                    f.write(cf_body)

        # 2. clientsource ve Extern icindeki tum dosyalarda uyumsuzluklari ve eksik typename'leri duzelt
        for target_root in ["clientsource", "Extern"]:
            if not os.path.exists(target_root): continue
            for root, dirs, files in os.walk(target_root):
                for fname in files:
                    if not fname.endswith((".h", ".cpp", ".c", ".hpp", ".inl")): continue
                    fpath = os.path.join(root, fname)
                    try:
                        with open(fpath, "r", encoding="latin-1") as f:
                            content = f.read()
                    except:
                        continue

                    orig = content

                    def fix_includes(m):
                        prefix, inc_path, suffix = m.group(1), m.group(2).replace("\\", "/"), m.group(3)
                        if inc_path.isupper() and "/" not in inc_path and "." not in inc_path:
                            inc_path = inc_path.lower()
                        return prefix + inc_path + suffix

                    content = re.sub(r"(#\s*include\s*[\"<])([^\"<>]+)([\">])", fix_includes, content)

                    if fname.lower() == "granny.h":
                        content = re.sub(r"GrannyTypeSizeCheck\s*\([^;]+\)\s*;", "// GrannyTypeSizeCheck disabled", content)

                    content = content.replace("typedef unsigned long DWORD;", "typedef uint32_t DWORD;")
                    content = content.replace("typedef unsigned long       DWORD;", "typedef uint32_t DWORD;")

                    if fname.lower() == "windows.h":
                        content = re.sub(r"typedef\s+int\s+HANDLE\s*;", "typedef void* HANDLE;", content)

                    if fname.lower() == "stdafx.h" and "eterbase" in root.lower():
                        content = re.sub(r"typedef\s+void\s*\*\s*HANDLE\s*;", "// typedef void* HANDLE;", content)
                        content = re.sub(r"typedef\s+struct\s*\{[^}]*left[^}]*\}\s*RECT\s*;", "// RECT defined in windows.h", content)
                        content = re.sub(r"typedef\s+struct\s*\{[^}]*LONG\s+x[^}]*\}\s*POINT\s*;", "// POINT defined in windows.h", content)

                    if fname.lower() == "utils.h":
                        content = "#ifndef PCHAR_DEFINED\n#define PCHAR_DEFINED\ntypedef char* PCHAR;\n#endif\n" + content

                    # Stl.h ve diger basliklardaki eksik typename ifadelerini otomatik ekle
                    content = re.sub(
                        r"(?<!typename\s)\b((?:std::(?:vector|list|map|set|deque)\s*<[^>]+>|TContainer|T|C)::(?:const_iterator|iterator|value_type|reference|reverse_iterator))\b",
                        r"typename \1",
                        content
                    )

                    if content != orig:
                        with open(fpath, "w", encoding="latin-1") as f:
                            f.write(content)

